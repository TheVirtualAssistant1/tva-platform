<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TVA Widget Test</title>
  <style>
    body { margin:0; height:100vh; background:#000; color:#fff; font-family:system-ui,Segoe UI,Arial; }
    #dbg { position:fixed; left:12px; top:12px; z-index:999999; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); padding:10px 12px; border-radius:10px; }
    #err { white-space:pre-wrap; margin-top:6px; color:#ff5c5c; }
  </style>
</head>
<body>
  <div id="dbg">
    <div><b>TVA Debug</b> – wenn das Widget nicht kommt, steht der Fehler hier.</div>
    <div id="err"></div>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      document.getElementById('err').textContent = (e.message || e.error || 'Unknown error') + "\\n" + (e.filename||'') + ":" + (e.lineno||'') ;
    });
    window.addEventListener('unhandledrejection', (e) => {
      document.getElementById('err').textContent = 'Promise rejection: ' + (e.reason && (e.reason.stack||e.reason) || e);
    });
  </script>

  <script
    src="http://localhost:3000/widget.js"
    data-customer-id="demo123"
    data-public-key="public_key_84ed83ce2fb89147805bf"
    data-agent-id="agent_252dc53978d6436c292b01fc91"
    data-agent-version="0"
    data-auto-open="true"
    data-logo-url="https://thevirtualassistant.site/favicon.ico"
  ></script>
</body>
</html>
